<a href="#main" class="sr-only z-50 rounded-lg bg-ink px-3 py-2 text-page focus:not-sr-only focus:fixed focus:top-3 focus:left-3">{{ t().app.skip }}</a>

<div class="min-h-dvh lg:grid lg:grid-cols-[15.5rem_minmax(0,1fr)]">
  <aside class="sticky top-0 hidden h-dvh flex-col border-r border-line bg-surface px-3 py-5 lg:flex">
    <a routerLink="/" class="mb-6 flex items-center gap-2.5 px-2"><app-logo /></a>

    <nav [attr.aria-label]="t().nav.main" class="flex flex-col gap-0.5">
      @for (item of nav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-surface-2 text-ink"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          ariaCurrentWhenActive="page"
          class="flex h-9 items-center gap-3 rounded-lg px-2.5 text-sm font-medium text-ink-2 transition-colors hover:bg-surface-2 hover:text-ink"
        >
          <svg [lucideIcon]="item.icon" size="18" strokeWidth="1.75"></svg>
          {{ item.label(t()) }}
        </a>
      }
    </nav>

    <div class="-mx-3 mt-auto flex flex-col gap-3 border-t border-line px-3 pt-3">
      <a
        routerLink="/settings"
        class="group flex items-center gap-3 rounded-lg px-2 py-1.5 transition-colors hover:bg-surface-2"
        [title]="ai().title"
      >
        <span class="relative grid size-8 shrink-0 place-items-center rounded-lg bg-surface-2 text-ink-2 transition-colors group-hover:bg-surface-3 group-hover:text-ink">
          <svg lucideIcon="bot" size="16" strokeWidth="1.75"></svg>
          <span class="absolute -right-0.5 -bottom-0.5 size-2.5 rounded-full ring-2 ring-surface" [class.animate-pulse]="ai().checking" [style.background]="ai().dot"></span>
        </span>
        <span class="min-w-0 flex-1 leading-tight">
          <span class="block truncate text-sm font-medium">{{ ai().name }}</span>
          <span class="block truncate text-xs text-muted">{{ ai().status }}</span>
        </span>
      </a>
      <div class="grid grid-cols-2 gap-2">
        <app-preferences />
      </div>
      <button type="button" class="btn-outline w-full" (click)="auth.signOut()">
        <svg lucideIcon="log-out" size="16"></svg>
        {{ t().auth.signOut }}
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-col">
    <header class="sticky top-0 z-30 flex h-14 items-center justify-between border-b border-line bg-page/85 px-4 backdrop-blur lg:hidden">
      <a routerLink="/" class="flex items-center gap-2"><app-logo /></a>
      <div class="flex items-center gap-2">
        <app-preferences />
        <button type="button" class="icon-btn size-8" [title]="t().auth.signOut" [attr.aria-label]="t().auth.signOut" (click)="auth.signOut()">
          <svg lucideIcon="log-out" size="16"></svg>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1" class="mx-auto w-full max-w-[100rem] flex-1 px-4 pt-4 pb-24 outline-none sm:px-5 lg:px-6 lg:pt-5 lg:pb-6">
      <router-outlet />
    </main>
  </div>

  <nav
    [attr.aria-label]="t().nav.main"
    [class.grid-cols-4]="nav().length === 4"
    [class.grid-cols-5]="nav().length === 5"
    class="fixed inset-x-0 bottom-0 z-30 grid border-t border-line bg-surface/95 pb-[env(safe-area-inset-bottom)] backdrop-blur lg:hidden"
  >
    @for (item of nav(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="text-ink"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        ariaCurrentWhenActive="page"
        class="flex h-16 flex-col items-center justify-center gap-1 text-[0.7rem] font-medium text-muted"
      >
        <svg [lucideIcon]="item.icon" size="20" strokeWidth="1.75"></svg>
        {{ item.label(t()) }}
      </a>
    }
  </nav>
</div>
