<h2 class="mb-3 text-base font-semibold tracking-tight">{{ t().dashboard.topMerchants }}</h2>
<ol class="flex flex-col gap-1">
  @for (m of rows(); track m.name) {
    <li>
      <a
        routerLink="/transactions"
        [queryParams]="{ q: m.name, from: summary().range.from, to: summary().range.to }"
        class="-mx-2 flex items-center gap-3 rounded-lg px-2 py-1.5 transition-colors hover:bg-surface-2"
      >
        <app-category-icon [categoryId]="m.categoryId" [size]="28" />
        <span class="min-w-0 flex-1">
          <span class="flex items-baseline justify-between gap-2">
            <span class="truncate text-sm font-medium">{{ m.name }}</span>
            <span class="flex items-baseline gap-2">
              @if (charged(m); as c) {
                <span class="num text-xs text-muted">{{ c }}</span>
              }
              <span class="num text-sm">{{ i18n.money(m.totalMinor, summary().baseCurrency, { whole: true }) }}</span>
            </span>
          </span>
          <span class="mt-1 flex items-center gap-2">
            <span class="h-1 flex-1 overflow-hidden rounded-full bg-surface-2">
              <span class="block h-full rounded-full" [style.width.%]="m.width" [style.background]="m.color"></span>
            </span>
            <span class="text-[0.7rem] text-muted">{{ m.txCount }}×</span>
          </span>
        </span>
      </a>
    </li>
  } @empty {
    <li class="py-8 text-center text-sm text-muted">{{ t().dashboard.emptyMonth }}</li>
  }
</ol>
